[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prismguard-ai"
version = "1.0.0"
description = "PrismGuard AI — Security Gateway for AI Applications with Defense-in-Depth & SecureAI Guard Integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PrismGuard AI Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

